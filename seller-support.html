<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Application Support | Virtual Space Lotto</title>
  <link rel="stylesheet" href="project-theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="support-page">
  <main class="support-shell">
    <section class="panel support-card">
      <p class="eyebrow">VIRTUAL SPACE LOTTO SUPPORT</p>
      <h1>Application under review</h1>
      <p>Your seller application is being checked by Virtual Space Lotto admin support. Processing usually takes <b>24–48 hours</b>.</p>
      <p>A representative will call your registered mobile number. You can also leave a follow-up message below.</p>
      <div id="supportStatus" class="support-status"></div>
      <div class="support-chatbot">
        <div id="supportMessages" class="support-messages"></div>
        <form id="supportForm">
          <input id="supportInput" required maxlength="220" placeholder="Type your follow-up message…">
          <button class="primary">Send to Admin Support</button>
        </form>
      </div>
      <a class="secondary support-back" href="index.html">Back to home</a>
    </section>
  </main>
  <script src="seller-support.js"></script>
</body>
</html>
